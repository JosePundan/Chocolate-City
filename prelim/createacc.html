<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP's Flower Shop - Create Account</title>
    <link rel="stylesheet" href="createacc.css">
</head>

<body>

    <nav>
      <div class="logo">
          JP's<span>Flower Shop</span>
      </div>
	</nav>
    

    <main class="main">
        <div class="form-container">
            <div class="title">
                <h1>Create Your Account</h1>
                <p>
                    Join JP's Flower Shop and discover beautiful blooms made for every occasion.
                </p>
                <div class="title-line"></div>
            </div>

            <div class="form-card">
                <form>
                <div class="section">
                	<h2 class="section-title">
                     Personal Information
                 	</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" placeholder="Enter your first name" required>
                            </div>

                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" placeholder="Enter your last name" required>
                            </div>

                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="example@email.com" required>
                            </div>

                            <div class="form-group">
                                <label>Phone Number</label>
                                <input  type="tel" placeholder="09XXXXXXXXX" required>
                            </div>

                            <div class="form-group full">
                                <label>Address</label>
                                <input type="text" placeholder="Enter your complete address" required>
                            </div>

                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" required>
                            </div>

                            <div class="form-group">
                                <label>City</label>
                                <input  type="text" placeholder="Enter your city" required>
                            </div>

                        </div>

                    </div>
                    
                    <div class="section">

                        <h2 class="section-title">
                            Account Details
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" placeholder="Create a username" required>
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" placeholder="Create a password" required>
                            </div>

                            <div class="form-group">
                                <label>Confirm Password</label>
                                <input type="password" placeholder="Confirm your password" required>
                            </div>

                            <div class="form-group">
                                <label>Customer Type</label>

                                <select required>
                                    <option value="">Select customer type</option>
                                    <option>Regular Customer</option>
                                    <option>Flower Club Member</option>
                                    <option>Business Customer</option>
                                </select>

                            </div>

                        </div>

                    </div>


                    <div class="section">

                        <h2 class="section-title">
                            Flower Preferences
                        </h2>

                        <label>
                            What is your favorite flower?
                        </label>

                        <div class="radio-group">

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="flower"
                                    value="rose"
                                >
                                Rose
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="flower"
                                    value="tulip"
                                >
                                Tulip
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="flower"
                                    value="sunflower"
                                >
                                Sunflower
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="flower"
                                    value="lily"
                                >
                                Lily
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="flower"
                                    value="carnation">
                                
                                Carnation
                            </label>

                        </div>

                    </div>

                    <div class="terms">
                        <input
                            type="checkbox"
                            id="terms"
                            required>
                        
                        <label for="terms">
                            I agree to JP's Flower Shop Terms and Conditions.
                        </label>
                    </div>

                    <div class="button-area">
                        <button
                            type="submit" 
                            class="create-btn">

                            Create Account
                        </button>
                    </div>
                    <p class="login-text">
                        Already have an account?
                        <a href="index.html">Log in</a>
                    </p>

                </form>

            </div>

        </div>

    </main>

</body>
</html>
