<!DOCTYPE html>
<html>
    
    <head>
        <meta charset="utf-8">

        <title> Div Tag Example</title>
    </head>

        <body>
            <div style="background-color: #abfbe4;">
                <h1>Welcome To My Website</h1>
                <p>Here you will find information about my services.</p>
                <ul>
                    <li>Service 1</li>
                    <li>Service 2</li>
                    <li>Service 3</li>
                </ul>

                <p>This is a <span style="color: red;">red</span> word.</p>

            </div>
        </body>
        
</html>
