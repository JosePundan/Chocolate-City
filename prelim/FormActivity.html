<!DOCTYPE html>
<html lang="en">
<head>
<title>Employee Details </title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Info</legend>

                <p>
                    First Name: <input type = "text" name = "fname" />
                </p>
                <p> 
                    Middle Name: <input type = "text" name = "fname" />
                </p>
                <p>
                    Last Name: <input type = "text" name = "iname" />
                </p>
        </fieldset>
        <fieldset>
            <legend> Course Info</legend>
            <p> Course:</p>
                <p>
                    <input type="radio" name = "Course" value = "Web Design"> Web Design
                </p>
                <p> 
                    <input type="radio" name = "Course" value = "SQL"> SQL 
                </p>
                 <p> 
                    <input type="radio" name = "Course" value = "Programming"> Programming 
                </p>
                 <p> 
                    <input type="radio" name = "Course" value = "Game Dev"> Game Dev
                 </p>
            

            <p>Career Goal:</p>
            <select>
                <option>Game Developer</option>
                <option>Web Developer</option>
                <option>Mobile Developer</option>
                <option>Data Analyst</option>
                <option>Data Engineer</option>
                <option>Graphic Artist</option>
            </select>
            </p>

            <p>Skills (check all that apply) : </p>
             <p>
                <input type="checkbox" name = "Skills (check all that apply )" value = "UNIX"> UNIX
                <input type="checkbox" name = "Skills (check all that apply )" value = "VIM"> VIM
            </p>
            <p>
                <input type="checkbox" name = "Skills (check all that apply )" value = "HTML"> HTML
                <input type="checkbox" name = "Skills (check all that apply )" value = "CSS"> CSS
            </p>
            <p>
                <input type="checkbox" name = "Skills (check all that apply )" value = "Python"> Python
                <input type="checkbox" name = "Skills (check all that apply )" value = "JavaScript"> JavaScript
            </p>

            <label>Describe any additional skills you have:</label>
                 <p>
                 <input type = "text" name = value /> 
                </p>

        </fieldset>
        <button> Enter my information</button>
    </form>
</body>
</html>
