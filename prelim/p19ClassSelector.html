<!DOCTYPE html>
<html>
<head>
<title> One or More class Selector </title>
<style>
p.class1 {
color: blue;
text-align: center;
}
p.large {
font-size: 200%;
}
</style>
</head>
<body>
<h1 class="class1"> One or More Class Selector </h1>
<p class="class1"> This is an example for selecting one or more element </p>
<p class="class1 large"> This is a paragraph which will be blue, center-aligned, and
written in a large font-size.</p>
</body>
</html>
