<!DOCTYPE html>
<html>
<head>
  <style>
    body {
    margin: 0;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    }

    .weather {
    width: 220px;
    padding: 20px;
    border-radius: 16px; 
    background: #eaf4ff;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #18324a;
    }

    .city {
      font-size: 18px;
      font-weight: bold;
    }

    .temp {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    .condition {
      font-size: 18px;
    }

    .details {
      margin-top: 10px;
      font-size: 12px;
      color: #587086;
    }
  </style>
</head>

<body>
  <h1> Weather widget</h1>
  <div class="weather">
    <div class="city" id="city">Lucena City</div>
    <div class="temp" id="temperature">30°C</div>
    <div class="condition" id="condition">☁️ Cloudy</div>
    <div class="details" id="details">
      Feels like 28°C · Humidity 78%
    </div>
  </div>

</body>
</html>
