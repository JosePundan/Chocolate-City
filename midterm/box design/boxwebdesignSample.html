<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }


    .header {
      background: #0077cc;
      color: white;
      padding: 20px; /* Padding inside header */
      border-bottom: 5px solid #005fa3; /* Border */
      text-align: center;
      margin-bottom: 20px; /* Margin below header */
    }


    .nav {
      background: #eee;
      padding: 15px;
      border: 2px solid #ccc;
      margin: 10px;
    }


    .content {
      background: white;
      padding: 20px;
      margin: 10px;
      border: 3px solid #0077cc;
    }


    .footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      border-top: 4px solid #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>My Simple Web Page</h1>
    <p>Using CSS Box Model</p>
  </div>


  <div class="nav">
    <b>Navigation:</b> Home | About | Contact
  </div>


  <div class="content">
    <h2>Welcome!</h2>
    <p>This is a simple template page demonstrating the <b>Box Model</b> in CSS.
       Notice how <i>padding, margin, and border</i> are applied to each section.</p>
  </div>


  <div class="footer">
    <p>&copy; 2025 My Website | Box Model Demo</p>
  </div>
</body>
</html>
