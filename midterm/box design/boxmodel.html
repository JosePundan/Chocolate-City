<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Example</title>
  <style>


    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 50px;
    }


    .box {
      width: 500px;             /* Content width */
      background-color: #fff;   /* Content area */
      padding: 20px;            /* Inside spacing */
      border: 7px solid #0077cc;/* Border */
      margin: 30px auto;        /* Outside spacing (centered) */
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin: 0;
      font-size: 22px;
      color: #0077cc;
    }


    p {
      font-size: 16px;
      color: #333;
    }
  </style>
</head>


    <body>
    <div class="box">
        <h2>Box Model Demo</h2>
        <p>This box shows <b>content</b>, <b>padding</b>, <b>border</b>, and <b>margin</b>.</p>
    </div>
       </body>
</html>
