<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      text-align: center;
    }


    .container {
      width: 600px;
      margin: auto;
    }


    .example {
      margin: 30px 0;
      padding: 15px;
      border: 3px dashed #444;
      background-color: #fff;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }


    .content-box {
      width: 200px;
      margin: 30px auto;
      padding: 20px;
      border: 5px solid #0077cc;
      background-color: #cce7ff;
      text-align: center;
    }


    .content {
      background: #ffeb99;
      padding: 10px;
    }


    .padding {
      background: #c8f7c5;
      padding: 20px;
    }


    .border {
      border: 5px solid #ff6666;
      padding: 10px;
    }


    .margin {
      background: #e5e5e5;
      margin: 20px;
      padding: 10px;
      border: 2px dashed #999;
    }


    h2 {
      color: #0077cc;
      margin-bottom: 10px;
    }


    p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Box Model Demo</h1>
    <p>Each box below demonstrates <b>Content, Padding, Border, and Margin</b>.</p>


    <!-- Simple Box -->
    <div class="example">
      <h2>Simple Box</h2>
      <div class="content-box">
        Content Area
      </div>
    </div>


    <!-- Layered Demo -->
    <div class="example">
      <h2>Layered Example</h2>
      <div class="margin">
        Margin Area
        <div class="border">
          Border Area
          <div class="padding">
            Padding Area
            <div class="content">
              Content Area






            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
