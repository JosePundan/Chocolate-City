
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Share Buttons</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    .share-button {
      display: inline-block;
      padding: 100px 150px;
      margin: 10px;
      color: white;
      text-decoration: none;
      border-radius: 20px;
    }

    .twitter {
      background-color: #000;
    }

    .facebook {
      background-color: #1877f2;
    }

    .gmail {
      background-color: #ea4335;
    }
  </style>
</head>

<body>
    <hi> Social media share buttons </hi>
  <h2>Share This Page</h2>


  <a href="https://twitter.com/intent/tweet?url=https://example.com&text=Check%20this%20out!"
    target="_blank">
    <img src="twitter.avif" alt= "twitter logo" width="60" title="twitter logo" text-align="center">
  </a>

 
  <a href="https://www.facebook.com/sharer/sharer.php?u=https://example.com"
    target="_blank">
    <img src="facebook.png"
        	 alt="facebook logo" width="60" title="facebook logo" text-align="center">
  </a>


  <a href="https://mail.google.com/mail/?view=cm&fs=1&su=Check%20this%20out!&body=https://example.com"
    target="_blank">
    <img src="email.png" alt="email logo" width="60" title="email logo" text-align="center">
  </a>

</body>
</html>
